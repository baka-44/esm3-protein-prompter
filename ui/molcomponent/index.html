<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden;
                 font-family: 'Montserrat', system-ui, sans-serif; }
    #viewport { width: 100%; height: 100vh; position: relative; }
    /* Overlay captures gestures in Pose mode so 3Dmol doesn't orbit the camera. */
    #overlay { position: absolute; inset: 0; z-index: 3; display: none; cursor: grab; }
    /* Rotation gizmo: screen-space rings, so the axes match what the user sees — X is the
       horizontal screen edge, Y the vertical, Z straight into the screen. Sits above the
       drag overlay; the overlay still handles free rotation anywhere off a ring. */
    #gizmo { position: absolute; inset: 0; z-index: 4; display: none; pointer-events: none; }
    #gizmo.active { display: block; }
    /* Every element is pointer-events:none — the overlay owns the pointer and hit-tests the
       rings by distance (see gizmoHit). SVG stroke hit-testing would make the grab target as
       thin as the stroke, and would resolve overlaps by DOM order rather than by proximity. */
    #gizmo .ring { fill: none; stroke-width: 3; opacity: .5; pointer-events: none;
                   transition: opacity .1s, stroke-width .1s; }
    #gizmo .ring.hot { opacity: 1; stroke-width: 6; }
    /* Shows the grab tolerance, so "how close do I need to be" is visible rather than guessed. */
    #gizmo .halo { fill: none; pointer-events: none; opacity: .16; }
    #gizmo .hub { fill: #0d0d0d; stroke: #3a3d42; stroke-width: 1; opacity: .75; }
    #gizmo text { font-family: 'Montserrat', system-ui, sans-serif; font-size: 11px;
                  font-weight: 600; pointer-events: none; }
    #overlay.active { display: block; }

    .panel { position: absolute; z-index: 5; color: #cfcfcf; font-size: 12px;
             background: rgba(18,18,18,0.72); border: 1px solid #333; border-radius: 8px;
             padding: 6px 8px; user-select: none; backdrop-filter: blur(2px); }
    #tools { top: 10px; left: 12px; display: flex; gap: 6px; align-items: center; padding: 5px; }
    .seg { display: flex; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
    .seg > span { padding: 4px 10px; cursor: pointer; color: #b8b8b8; white-space: nowrap; }
    .seg > span.on { background: #e08a2b; color: #111; font-weight: 600; }
    .icon { padding: 4px 8px; cursor: pointer; border: 1px solid #333; border-radius: 6px; color: #b8b8b8; }
    .icon.on { border-color: #e08a2b; color: #e08a2b; }

    #metrics { top: 10px; right: 12px; max-width: 220px; display: none; }
    #metrics .row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
    #metrics .k { color: #8a8a8a; } #metrics .v { color: #dcdcdc; }
    #metrics .bad .v, #metrics .bad .k { color: #ff6b6b; }
    #metrics h4 { margin: 0 0 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #777; font-weight: 600; }

    /* posing state pill (only while Pose mode) */
    #sel { top: 52px; left: 12px; display: none; border-color: #e08a2b; }
    #sel.show { display: block; }
    #sel b { color: #e08a2b; }
    #hud { bottom: 12px; left: 12px; display: none; }
    #hud.show { display: block; } #hud b { color: #e08a2b; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="overlay"></div>
  <svg id="gizmo" aria-hidden="true"></svg>

  <div id="tools" class="panel">
    <div class="seg">
      <span id="m_cam" class="on">🔄 Camera</span>
      <span id="m_cut">✂ Cut</span>
      <span id="m_pose">✋ Pose&nbsp;Mount</span>
    </div>
    <span id="m_conn" class="icon on" title="Toggle linker-connection arrows">⇢</span>
    <span id="m_sticks" class="icon" title="Toggle side chains (repack residues)">🧬</span>
    <span id="m_grid" class="icon on" title="Toggle reference grid">▦</span>
  </div>

  <div id="sel" class="panel">posing <b>MOUNT</b> (orange) · torso fixed · <b>Esc</b> to release</div>
  <div id="cutpill" class="panel" style="top:52px;left:12px;display:none;border-color:#ff6b6b">
    <b style="color:#ff6b6b">✂ Cut</b> — click two <b>torso</b> residues to set the excision span</div>
  <div id="metrics" class="panel"><h4>metrics</h4><div id="metrics_body"></div></div>
  <div id="hud" class="panel">click a residue</div>

  <script>
    const Streamlit = {
      ready() { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*"); },
      setFrameHeight(h) { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*"); },
      setValue(v) { window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value: v, dataType: "json" }, "*"); },
    };

    // ── tiny vec / quat helpers (avoid depending on 3Dmol's internal math) ──────
    const V = {
      sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
      add: (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]],
      scale: (a, s) => [a[0]*s, a[1]*s, a[2]*s],
      dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
      norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
    };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    function qMul(a, b) { // Hamilton product, quats as [x,y,z,w]
      return [
        a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
        a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
        a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
        a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2],
      ];
    }
    const qConj = (q) => [-q[0], -q[1], -q[2], q[3]];
    function qFromAxisAngle(axis, ang) {
      const l = Math.hypot(axis[0], axis[1], axis[2]) || 1;
      const s = Math.sin(ang / 2) / l;
      return [axis[0]*s, axis[1]*s, axis[2]*s, Math.cos(ang / 2)];
    }
    function qToM3(q) { // → row-major 3x3 (standard rotation matrix, v' = R·v)
      const [x, y, z, w] = q;
      return [
        1-2*(y*y+z*z), 2*(x*y-z*w),   2*(x*z+y*w),
        2*(x*y+z*w),   1-2*(x*x+z*z), 2*(y*z-x*w),
        2*(x*z-y*w),   2*(y*z+x*w),   1-2*(x*x+y*y),
      ];
    }
    const m3apply = (R, v) => [
      R[0]*v[0] + R[1]*v[1] + R[2]*v[2],
      R[3]*v[0] + R[4]*v[1] + R[5]*v[2],
      R[6]*v[0] + R[7]*v[1] + R[8]*v[2],
    ];
    const qRot = (q, v) => m3apply(qToM3(q), v);

    // ── viewer state ───────────────────────────────────────────────────────────
    let viewer = null, model = null, lastPdb = null, mountChain = "B", lastReset = null;
    let allAtoms = [], baseCoords = [], isMount = [], centroid = [0, 0, 0];
    let qAcc = [0, 0, 0, 1], tAcc = [0, 0, 0];   // cumulative mount pose (about centroid)
    let repackList = [];
    let gridOn = true, gridShapes = [], bbox = null;
    let connections = [], connShapes = [], connOn = true;   // linker exit-vector arrows
    let sticksOn = false;                                   // repack-residue side chains (off = clean cartoon)
    let pendingCut = null;                                  // first scissor click (chain A resi)
    let mode = "cam";                                       // "cam" | "cut" | "pose"
    const R_SENS = 0.6 * Math.PI / 180;          // rad per px (drag rotate)
    const T_SENS = 0.05;                         // Å per wheel unit (translate)

    function hud(s, show) { const h = document.getElementById("hud"); h.innerHTML = s; h.classList.toggle("show", show !== false); }

    function drawGrid() {
      gridShapes.forEach(s => viewer.removeShape(s)); gridShapes = [];
      if (!gridOn || !bbox) { viewer.render(); return; }
      const { min, max } = bbox, pad = 6, step = 8;
      const lo = { x: min.x - pad, y: min.y - pad, z: min.z - pad };
      const hi = { x: max.x + pad, y: max.y + pad, z: max.z + pad };
      const C = "0x2c2c2c", CE = "0x3d3d3d";
      const line = (a, b, c) => gridShapes.push(viewer.addLine({ start: a, end: b, color: c }));
      const range = (a, b) => { const o = []; for (let v = Math.ceil(a / step) * step; v <= b; v += step) o.push(v); return o; };
      range(lo.x, hi.x).forEach(x => line({ x, y: lo.y, z: lo.z }, { x, y: lo.y, z: hi.z }, C));
      range(lo.z, hi.z).forEach(z => line({ x: lo.x, y: lo.y, z }, { x: hi.x, y: lo.y, z }, C));
      range(lo.x, hi.x).forEach(x => line({ x, y: lo.y, z: lo.z }, { x, y: hi.y, z: lo.z }, C));
      range(lo.y, hi.y).forEach(y => line({ x: lo.x, y, z: lo.z }, { x: hi.x, y, z: lo.z }, C));
      range(lo.z, hi.z).forEach(z => line({ x: lo.x, y: lo.y, z }, { x: lo.x, y: hi.y, z }, C));
      range(lo.y, hi.y).forEach(y => line({ x: lo.x, y, z: lo.z }, { x: lo.x, y, z: hi.z }, C));
      line({ x: lo.x, y: lo.y, z: lo.z }, { x: hi.x, y: lo.y, z: lo.z }, CE);
      line({ x: lo.x, y: lo.y, z: lo.z }, { x: lo.x, y: hi.y, z: lo.z }, CE);
      line({ x: lo.x, y: lo.y, z: lo.z }, { x: lo.x, y: lo.y, z: hi.z }, CE);
      viewer.render();
    }

    // Write the current cumulative pose (qAcc about `centroid` + tAcc) into the mount atoms.
    // 3Dmol only regenerates cartoon geometry on setStyle — NOT on setCoordinates+render — so
    // every visual update must edit the atom objects and then re-apply the mount's style.
    function writeMountCoords() {
      for (let j = 0; j < allAtoms.length; j++) {
        if (!isMount[j]) continue;
        const p = V.add(V.add(qRot(qAcc, V.sub(baseCoords[j], centroid)), centroid), tAcc);
        allAtoms[j].x = p[0]; allAtoms[j].y = p[1]; allAtoms[j].z = p[2];
      }
    }
    // Move a connection endpoint by the live pose if it belongs to the mount (torso ends are fixed).
    const livePt = (p, isM) => isM ? V.add(V.add(qRot(qAcc, V.sub(p, centroid)), centroid), tAcc) : p;

    // Exit-vector arrows: at every open end (2 torso + 2 mount) an arrow points the way the
    // backbone was flowing (the direction the excised loop would have continued). Each linker
    // pairs one torso end with one mount end; the pair GLOWS by how well the two arrows point at
    // each other — green ≤5°, yellow ≤20°, dim beyond. Pose the mount until they meet head-to-head
    // → a linker can bridge them with minimal strain. Mount arrows rotate live with the pose.
    function liveEnd(e) {
      const pos = e.m ? V.add(V.add(qRot(qAcc, V.sub(e.pos, centroid)), centroid), tAcc) : e.pos;
      const dir = V.norm(e.m ? qRot(qAcc, e.dir) : e.dir);
      return { pos, dir };
    }
    function drawArrow(pos, dir, col) {
      const end = V.add(pos, V.scale(dir, 5.0));
      connShapes.push(viewer.addArrow({
        start: { x: pos[0], y: pos[1], z: pos[2] }, end: { x: end[0], y: end[1], z: end[2] },
        radius: 0.28, color: col, radiusRatio: 2.6,
      }));
    }
    function drawConnections() {
      connShapes.forEach(s => viewer.removeShape(s)); connShapes = [];
      if (!connOn || !connections.length) return;
      connections.forEach(pair => {
        const A = liveEnd(pair.a), B = liveEnd(pair.b);
        const axis = V.norm(V.sub(B.pos, A.pos));
        // each arrow should point toward the other end → align A.dir with axis, B.dir with -axis
        const ang = Math.max(Math.acos(clamp(V.dot(A.dir, axis), -1, 1)),
                             Math.acos(clamp(V.dot(B.dir, V.scale(axis, -1)), -1, 1))) * 180 / Math.PI;
        const col = ang <= 5 ? "0x39d98a" : (ang <= 20 ? "0xffd23f" : "0x9a9a9a");
        drawArrow(A.pos, A.dir, col); drawArrow(B.pos, B.dir, col);
      });
    }

    // Full-detail styling (Camera mode): cartoon + faint CA click-spheres + repack sticks.
    function styleFull() {
      writeMountCoords();
      viewer.setStyle({ chain: "A" }, { cartoon: { color: "#9aa0a6" } });
      viewer.setStyle({ chain: mountChain }, { cartoon: { color: "#e08a2b" } });
      viewer.addStyle({ atom: "CA" }, { sphere: { radius: 0.7, opacity: 0.14, color: "0xbbbbbb" } });
      if (sticksOn) repackList.forEach(t => {
        viewer.addStyle({ chain: t[0], resi: parseInt(t.slice(1)) },
          { stick: { colorscheme: "yellowCarbon", radius: 0.2 } });
      });
      drawConnections();
      viewer.render();
    }
    // Cartoon-only (Pose mode): stick/sphere geometry can't follow a live coordinate edit, so we
    // drop it while dragging and rebuild it (styleFull) on release — no detached side chains.
    function styleCartoonOnly() {
      writeMountCoords();
      viewer.setStyle({ chain: "A" }, { cartoon: { color: "#9aa0a6" } });
      viewer.setStyle({ chain: mountChain }, { cartoon: { color: "#ffa64d" } });   // brighter = selected
      drawConnections();
      viewer.render();
    }

    // Live pose update while dragging: rebuild ONLY the mount's cartoon (torso is untouched),
    // throttled to one render per animation frame so rapid gestures don't pile up.
    let poseDirty = false, poseRAF = null;
    function renderPose() {
      writeMountCoords();
      viewer.setStyle({ chain: mountChain }, { cartoon: { color: mode === "pose" ? "#ffa64d" : "#e08a2b" } });
      drawConnections();
      viewer.render();
    }
    function applyPose() {
      poseDirty = true;
      if (poseRAF) return;
      poseRAF = requestAnimationFrame(() => { poseRAF = null; if (poseDirty) { poseDirty = false; renderPose(); } });
    }

    function buildModel(pdb) {
      document.getElementById("viewport").innerHTML = "";
      viewer = $3Dmol.createViewer("viewport", { backgroundColor: "0x0d0d0d" });
      model = viewer.addModel(pdb, "pdb");
      allAtoms = model.selectedAtoms({});
      baseCoords = allAtoms.map(a => [a.x, a.y, a.z]);
      isMount = allAtoms.map(a => a.chain === mountChain);
      const mc = baseCoords.filter((_, j) => isMount[j]);
      centroid = mc.length ? mc.reduce((s, p) => V.add(s, p), [0, 0, 0]).map(v => v / mc.length) : [0, 0, 0];
      qAcc = [0, 0, 0, 1]; tAcc = [0, 0, 0];
      styleFull();
      viewer.setClickable({}, true, (atom) => {
        if (mode === "pose") return;                      // Pose mode: the overlay owns the gesture
        if (mode === "cut") { onCutClick(atom); return; } // Cut mode: scissor two torso residues
        hud("picked <b>" + atom.chain + atom.resi + "</b> (" + atom.resn + ")");
        Streamlit.setValue({ kind: "pick", chain: atom.chain, resi: atom.resi, resn: atom.resn, ts: Date.now() });
      });
      const cas = allAtoms.filter(a => a.atom === "CA");
      if (cas.length) {
        const xs = cas.map(a => a.x), ys = cas.map(a => a.y), zs = cas.map(a => a.z);
        bbox = { min: { x: Math.min(...xs), y: Math.min(...ys), z: Math.min(...zs) },
                 max: { x: Math.max(...xs), y: Math.max(...ys), z: Math.max(...zs) } };
      } else bbox = null;
      viewer.zoomTo();
      drawGrid();
      if (mode === "pose") setMode("pose");   // keep cartoon-only if we were posing
    }

    function setMetrics(list) {
      const box = document.getElementById("metrics"), body = document.getElementById("metrics_body");
      if (!list || !list.length) { box.style.display = "none"; return; }
      body.innerHTML = list.map(m =>
        `<div class="row ${m.ok ? "" : "bad"}"><span class="k">${m.label}</span>` +
        `<span class="v">${m.value}${m.unit ? " " + m.unit : ""}${m.ok ? "" : " ⚠"}</span></div>`).join("");
      box.style.display = "block";
    }

    // ── camera basis (so drag rotates / scroll translates as seen) ──────────────
    function camBasis() {
      // rotationGroup.quaternion rotates world→view; invert to map screen axes to world.
      let q = [0, 0, 0, 1];
      try { const c = viewer.rotationGroup.quaternion; q = [c.x, c.y, c.z, c.w]; } catch (e) {}
      const inv = qConj(q);
      return { right: qRot(inv, [1, 0, 0]), up: qRot(inv, [0, 1, 0]) };
    }

    // ── scissor-by-click cuts (Cut mode): click two torso residues → set the excision span ──
    function markCut(resi) {
      viewer.addStyle({ chain: "A", resi }, { sphere: { radius: 1.3, color: "0xff5b5b" } });
      viewer.render();
    }
    function onCutClick(atom) {
      if (atom.chain !== "A") { hud("cut points must be on the <b>torso</b> (grey)", true); return; }
      if (pendingCut === null) {
        pendingCut = atom.resi; markCut(atom.resi);
        hud("cut start <b>A" + atom.resi + "</b> — click the other end", true);
      } else {
        const c1 = Math.min(pendingCut, atom.resi), c2 = Math.max(pendingCut, atom.resi);
        markCut(atom.resi); pendingCut = null;
        hud("excising <b>A" + c1 + "–A" + c2 + "</b> …", true);
        Streamlit.setValue({ kind: "cut_span", cut1: c1, cut2: c2, ts: Date.now() });
      }
    }

    // ── mode toggle (Camera / Cut / Pose) ────────────────────────────────────────
    function setMode(m) {
      mode = m; pendingCut = null;
      document.getElementById("m_cam").classList.toggle("on", m === "cam");
      document.getElementById("m_cut").classList.toggle("on", m === "cut");
      document.getElementById("m_pose").classList.toggle("on", m === "pose");
      document.getElementById("overlay").classList.toggle("active", m === "pose");
      document.getElementById("sel").classList.toggle("show", m === "pose");
      document.getElementById("cutpill").style.display = (m === "cut") ? "block" : "none";
      if (m === "pose") { styleCartoonOnly(); drawGizmo();
        hud("<b>drag a ring</b> to rotate on one axis · <b>drag free</b> for coarse · <b>two-finger scroll</b> move", true); }
      else if (m === "cut") { styleFull(); drawGizmo(); hud("click two <b>torso</b> residues to set the cut", true); }
      else { styleFull(); drawGizmo(); hud("click a residue", false); }
    }
    document.getElementById("m_cam").onclick = () => setMode("cam");
    document.getElementById("m_cut").onclick = () => setMode("cut");
    document.getElementById("m_pose").onclick = () => setMode("pose");
    document.getElementById("m_grid").onclick = () => {
      gridOn = !gridOn; document.getElementById("m_grid").classList.toggle("on", gridOn); drawGrid();
    };
    document.getElementById("m_conn").onclick = () => {
      connOn = !connOn; document.getElementById("m_conn").classList.toggle("on", connOn);
      mode === "pose" ? styleCartoonOnly() : styleFull();
    };
    document.getElementById("m_sticks").onclick = () => {
      sticksOn = !sticksOn; document.getElementById("m_sticks").classList.toggle("on", sticksOn);
      mode === "pose" ? styleCartoonOnly() : styleFull();   // sticks only render in Camera/Cut mode
    };
    window.addEventListener("keydown", (e) => { if (e.key === "Escape" && mode !== "cam") setMode("cam"); });

    // ── rotation gizmo ───────────────────────────────────────────────────────────
    // Three rings in SCREEN space: the user thinks in screen axes (X = the horizontal edge of
    // the laptop, Y = vertical, Z = into the screen), so the gizmo is drawn and hit-tested in
    // 2D and only converted to world axes at the moment of rotation, via the camera basis.
    // Free drag anywhere off a ring is unchanged — the gizmo adds constraint, it does not
    // replace the coarse control.
    const GIZ = document.getElementById("gizmo");
    const GIZ_FLAT = 0.34;            // foreshortening of the two edge-on rings
    const GIZ_GRAB = 10;              // px: how far off a ring still grabs it
    const GIZ_SAMPLES = 96;           // ring polyline resolution for hit-testing
    // Radii are fractions of a viewport-relative base, so the gizmo stays comfortably
    // grabbable on a laptop and doesn't swamp the mount on a large display.
    const GIZ_AXES = [
      { id: "z", color: "#5ba3f5", fx: 1,         fy: 1,         label: "Z" },
      { id: "y", color: "#39d98a", fx: GIZ_FLAT,  fy: 1,         label: "Y" },
      { id: "x", color: "#ff6b6b", fx: 1,         fy: GIZ_FLAT,  label: "X" },
    ];
    function gizmoRadius() {
      const vp = document.getElementById("viewport");
      return Math.max(96, Math.min(160, Math.min(vp.clientWidth, vp.clientHeight) * 0.17));
    }
    let gizAxis = null;               // axis currently being DRAGGED
    let gizHot = null;                // axis currently under the pointer (within GIZ_GRAB)
    let gizCentre = [0, 0];
    let gizPaths = [];                // [{id, pts:[[x,y],…]}] — cached for hit-testing

    // Distance from a point to a SEGMENT of the sampled ring. Measuring to the sample points
    // instead would leave up to half a chord (~3.9 px at 96 samples on a 118 px ring) of slack,
    // so the real tolerance would sag between samples and the ring would feel inconsistent.
    function segDist2(x, y, ax, ay, bx, by) {
      const vx = bx - ax, vy = by - ay, wx = x - ax, wy = y - ay;
      const vv = vx * vx + vy * vy;
      let t = vv > 0 ? (wx * vx + wy * vy) / vv : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = wx - t * vx, dy = wy - t * vy;
      return dx * dx + dy * dy;
    }

    // Nearest ring within GIZ_GRAB px wins. Polyline sampling sidesteps the iterative
    // point-to-ellipse distance problem; at 96 segments the polyline sits within ~0.07 px of
    // the true ellipse, far below the tolerance it feeds. Nearest-wins also makes the rings'
    // crossings resolve by proximity rather than by draw order.
    function gizmoHit(x, y) {
      let best = null, bestD = GIZ_GRAB * GIZ_GRAB;
      for (const p of gizPaths) {
        const n = p.pts.length;
        let d = Infinity;
        for (let i = 0; i < n; i++) {
          const a = p.pts[i], b = p.pts[(i + 1) % n];
          const dd = segDist2(x, y, a[0], a[1], b[0], b[1]);
          if (dd < d) d = dd;
        }
        if (d < bestD) { bestD = d; best = p.id; }
      }
      return best;
    }

    function gizmoCentre() {
      // Prefer the mount's own projected centroid so the gizmo sits on what it rotates;
      // fall back to the viewport centre if the viewer exposes no projection.
      const vp = document.getElementById("viewport");
      const w = vp.clientWidth, h = vp.clientHeight;
      try {
        if (viewer && typeof viewer.modelToScreen === "function") {
          const c = V.add(centroid, tAcc);
          const s = viewer.modelToScreen({ x: c[0], y: c[1], z: c[2] });
          if (s && isFinite(s.x) && isFinite(s.y)) return [s.x, s.y];
        }
      } catch (e) { /* fall through */ }
      return [w / 2, h / 2];
    }

    function drawGizmo() {
      if (mode !== "pose") { GIZ.classList.remove("active"); return; }
      GIZ.classList.add("active");
      const [cx, cy] = gizCentre = gizmoCentre();
      const R = gizmoRadius();
      const geom = GIZ_AXES.map(a => ({ ...a, rx: a.fx * R, ry: a.fy * R }));
      GIZ.setAttribute("viewBox", `0 0 ${GIZ.clientWidth} ${GIZ.clientHeight}`);

      // Cache each ring as a polyline for distance-based hit-testing.
      gizPaths = geom.map(a => {
        const pts = [];
        for (let i = 0; i < GIZ_SAMPLES; i++) {
          const t = (i / GIZ_SAMPLES) * Math.PI * 2;
          pts.push([cx + a.rx * Math.cos(t), cy + a.ry * Math.sin(t)]);
        }
        return { id: a.id, pts };
      });

      const live = gizAxis || gizHot;
      GIZ.innerHTML =
        geom.filter(a => a.id === live).map(a =>
          `<ellipse class="halo" cx="${cx}" cy="${cy}" rx="${a.rx}" ry="${a.ry}" ` +
          `stroke="${a.color}" stroke-width="${GIZ_GRAB * 2}"></ellipse>`).join("") +
        geom.map(a =>
          `<ellipse class="ring${live === a.id ? " hot" : ""}" data-axis="${a.id}" ` +
          `cx="${cx}" cy="${cy}" rx="${a.rx}" ry="${a.ry}" stroke="${a.color}"></ellipse>`).join("") +
        `<circle class="hub" cx="${cx}" cy="${cy}" r="4"></circle>` +
        geom.map(a => {
          const lx = cx + (a.id === "y" ? 0 : a.rx + 12);
          const ly = cy + (a.id === "y" ? -(a.ry + 10) : 4);
          return `<text x="${lx}" y="${ly}" fill="${a.color}" ` +
                 `opacity="${live && live !== a.id ? .4 : 1}">${a.label}</text>`;
        }).join("");
    }

    function gizmoWorldAxis(id) {
      const b = camBasis();
      if (id === "y") return b.up;                     // yaw   — about the vertical screen edge
      if (id === "x") return b.right;                  // pitch — about the horizontal screen edge
      return [                                         // roll  — straight into the screen
        b.right[1] * b.up[2] - b.right[2] * b.up[1],
        b.right[2] * b.up[0] - b.right[0] * b.up[2],
        b.right[0] * b.up[1] - b.right[1] * b.up[0],
      ];
    }

    function startGizmoDrag(e, axis) {
      e.preventDefault(); e.stopPropagation();
      gizAxis = axis; gizHot = axis; px = e.clientX; py = e.clientY;
      dragging = false;                                // gizmo drag, not free drag
      drawGizmo();
      hud(`rotating about <b>${axis.toUpperCase()}</b> — release to apply`, true);
    }

    function gizmoDelta(axis, e, rect) {
      // Z reads the angle swept around the hub; X and Y read the drag component perpendicular
      // to their ring, which is what the ring's shape already suggests to the user.
      if (axis === "z") {
        const cx = rect.left + gizCentre[0], cy = rect.top + gizCentre[1];
        const a0 = Math.atan2(py - cy, px - cx), a1 = Math.atan2(e.clientY - cy, e.clientX - cx);
        let d = a1 - a0;
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        return -d;
      }
      return (axis === "y" ? (e.clientX - px) : (e.clientY - py)) * R_SENS;
    }

    function sendPose() {
      Streamlit.setValue({ kind: "pose_xform", rot: qToM3(qAcc), tran: tAcc, about: centroid, ts: Date.now() });
    }

    // ── live rotate (drag) ───────────────────────────────────────────────────────
    const ov = document.getElementById("overlay");
    let dragging = false, px = 0, py = 0;
    ov.addEventListener("mousedown", (e) => {
      // A ring under (or within GIZ_GRAB of) the pointer takes precedence; anywhere else is
      // still the coarse free drag, so the gizmo constrains without removing the old control.
      const r = GIZ.getBoundingClientRect();
      const hit = mode === "pose" ? gizmoHit(e.clientX - r.left, e.clientY - r.top) : null;
      if (hit) { startGizmoDrag(e, hit); return; }
      dragging = true; px = e.clientX; py = e.clientY; ov.style.cursor = "grabbing";
    });
    // Hover: highlight the ring the pointer would grab, so the tolerance is discoverable.
    ov.addEventListener("mousemove", (e) => {
      if (gizAxis || dragging || mode !== "pose") return;
      const r = GIZ.getBoundingClientRect();
      const hit = gizmoHit(e.clientX - r.left, e.clientY - r.top);
      if (hit === gizHot) return;
      gizHot = hit;
      drawGizmo();
      if (hit) hud(`<b>${hit.toUpperCase()}</b> axis — click and hold to rotate about it`, true);
      else hud("<b>drag a ring</b> to rotate on one axis · <b>drag free</b> for coarse · <b>Esc</b> done", true);
    });
    ov.addEventListener("mouseleave", () => {
      if (gizAxis || dragging || !gizHot) return;
      gizHot = null; drawGizmo();
    });
    window.addEventListener("mousemove", (e) => {
      if (gizAxis) {                                   // constrained: one axis only
        const ang = gizmoDelta(gizAxis, e, GIZ.getBoundingClientRect());
        px = e.clientX; py = e.clientY;
        qAcc = qMul(qFromAxisAngle(gizmoWorldAxis(gizAxis), ang), qAcc);
        applyPose(); drawGizmo();
        return;
      }
      if (!dragging) return;
      const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
      const b = camBasis();
      // horizontal drag → spin about screen-up; vertical drag → tumble about screen-right
      let q = qFromAxisAngle(b.up, dx * R_SENS);
      q = qMul(qFromAxisAngle(b.right, dy * R_SENS), q);
      qAcc = qMul(q, qAcc);
      applyPose(); drawGizmo();
      hud("rotating mount — release to apply", true);
    });
    window.addEventListener("mouseup", () => {
      if (gizAxis) {
        gizAxis = null; gizHot = null; sendPose(); drawGizmo();
        hud("<b>drag a ring</b> to rotate on one axis · <b>drag free</b> for coarse · <b>Esc</b> done", true);
        return;
      }
      if (!dragging) return;
      dragging = false; ov.style.cursor = "grab";
      sendPose();
      hud("<b>drag</b> rotate · <b>two-finger scroll</b> move · <b>Esc</b> done", true);
    });
    // ── live translate (two-finger scroll) ───────────────────────────────────────
    let wheelTimer = null;
    ov.addEventListener("wheel", (e) => {
      if (e.ctrlKey) return;                 // pinch-zoom → camera
      e.preventDefault();
      const b = camBasis();
      const d = V.add(V.scale(b.right, e.deltaX * T_SENS), V.scale(b.up, -e.deltaY * T_SENS));
      tAcc = V.add(tAcc, d);
      applyPose();
      hud("moving mount — release to apply", true);
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(sendPose, 200);
    }, { passive: false });

    // ── camera pan / zoom (Camera & Cut modes) ──────────────────────────────────
    // Unify the gesture model with Pose mode: two-finger scroll = PAN the whole scene,
    // pinch = zoom. Drag stays 3Dmol's orbit. Intercept the wheel in the capture phase before
    // 3Dmol's canvas handler (which would otherwise zoom on every scroll). In Pose mode the
    // overlay sits above the viewport and owns the wheel, so this never fires there.
    document.getElementById("viewport").addEventListener("wheel", (e) => {
      if (mode === "pose") return;
      e.preventDefault(); e.stopImmediatePropagation();
      if (!viewer) return;
      if (e.ctrlKey) viewer.zoom(Math.pow(1.0016, -e.deltaY), 40);        // pinch → zoom
      else viewer.translate(e.deltaX, -e.deltaY, 40);                     // two-finger scroll → pan (scene follows fingers)
    }, { capture: true, passive: false });

    function onRender(args) {
      const pdb = args.pdb || "", h = args.height || 600;
      mountChain = args.mount_chain || "B";
      repackList = args.repack || [];
      connections = args.connections || [];
      if (pdb !== lastPdb) { lastPdb = pdb; if (pdb) buildModel(pdb); }
      else { mode === "pose" ? styleCartoonOnly() : styleFull(); }   // refresh arrows on new props
      if (args.reset_ts && args.reset_ts !== lastReset) {   // Python asked to reset the pose
        lastReset = args.reset_ts; qAcc = [0, 0, 0, 1]; tAcc = [0, 0, 0];
        mode === "pose" ? styleCartoonOnly() : styleFull();
      }
      setMetrics(args.metrics || []);
      document.getElementById("viewport").style.height = h + "px";
      Streamlit.setFrameHeight(h + 4);
    }
    window.addEventListener("message", (e) => { if (e.data && e.data.type === "streamlit:render") onRender(e.data.args); });
    Streamlit.ready();
    Streamlit.setFrameHeight(640);
  </script>
</body>
</html>
